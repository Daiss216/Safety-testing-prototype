version: "3.9"

# BAYORA POC - secure adversarial AI testing infrastructure
# Tenants are split across networks: the UI can reach only the API,
# Postgres and Ollama are internal and reachable only from the backend.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bayora
      POSTGRES_PASSWORD: bayora
      POSTGRES_DB: bayora
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    mem_limit: 512m # cgroup resource governance
    cpus: 0.5

  ollama:
    image: ollama/ollama:latest
    networks: [llm]
    mem_limit: 4g
    cpus: 2.0

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://bayora:bayora@db:5432/bayora
      OLLAMA_HOST: http://ollama:11434
      BAYORA_MODEL: llama3.2:3b
      BAYORA_SECRET: dev-secret-change-me
      BAYORA_OPERATOR_TOKEN: dev-operator-change-me
      BAYORA_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on: [db, ollama]
    networks: [edge, data, llm]
    #infrastructure hardening (Security Core)
    cap_drop: [ALL]
    security_opt:
      - seccomp=./backend/seccomp-bayora.json
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on: [backend]
    networks: [edge]

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
  # Not internal: Ollama needs egress to pull models. Isolation is membership —
  # only backend is attached, so frontend/db cannot resolve or reach it.
  llm:
    driver: bridge

volumes:
  pgdata:
