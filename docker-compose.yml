# BAYORA POC — red, blue, and the model are separate containers.
# Broker never sits on the llm network. Workers are not published to the host.

x-backend-build: &backend-build
  build: ./backend
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bayora
      POSTGRES_PASSWORD: bayora
      POSTGRES_DB: bayora
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    mem_limit: 512m
    cpus: 0.5

  ollama:
    image: ollama/ollama:latest
    networks: [llm]
    mem_limit: 4g
    cpus: 2.0

  model-gateway:
    <<: *backend-build
    command:
      ["uvicorn", "model_gateway:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      BAYORA_MODEL: llama3.2:3b
      BAYORA_GATEWAY_TOKEN: ${BAYORA_GATEWAY_TOKEN}
      BAYORA_FLUSH_EVERY_CALL: "0"
    depends_on: [ollama]
    networks: [llm, tenants]
    mem_limit: 256m
    cpus: 0.5

  blue-worker:
    <<: *backend-build
    command:
      ["uvicorn", "blue_worker:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      DATABASE_URL: postgresql+psycopg2://bayora:bayora@db:5432/bayora
      BAYORA_BLUE_SECRET: ${BAYORA_BLUE_SECRET:-dev-blue-secret-change-me}
      BAYORA_INTERNAL_TOKEN: ${BLUE_INTERNAL_TOKEN:-dev-blue-internal-change-me}
      BAYORA_EVAL_TOKEN: ${BAYORA_EVAL_TOKEN:-dev-eval-token-change-me}
    depends_on: [db]
    networks: [data, tenants]
    mem_limit: 256m
    cpus: 0.5

  red-worker:
    <<: *backend-build
    command:
      ["uvicorn", "red_worker:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE_URL: postgresql+psycopg2://bayora:bayora@db:5432/bayora
      BAYORA_RED_SECRET: ${BAYORA_RED_SECRET:-dev-red-secret-change-me}
      BAYORA_INTERNAL_TOKEN: ${RED_INTERNAL_TOKEN:-dev-red-internal-change-me}
      BAYORA_EVAL_TOKEN: ${BAYORA_EVAL_TOKEN:-dev-eval-token-change-me}
      BAYORA_GATEWAY_TOKEN: ${BAYORA_GATEWAY_TOKEN:-dev-gateway-change-me}
      GATEWAY_URL: http://model-gateway:8003
      BLUE_WORKER_URL: http://blue-worker:8002
    depends_on: [db, model-gateway, blue-worker]
    networks: [data, tenants]
    mem_limit: 256m
    cpus: 0.5

  backend:
    <<: *backend-build
    environment:
      DATABASE_URL: postgresql+psycopg2://bayora:bayora@db:5432/bayora
      BAYORA_OPERATOR_TOKEN: ${BAYORA_OPERATOR_TOKEN}
      RED_INTERNAL_TOKEN: ${RED_INTERNAL_TOKEN:-dev-red-internal-change-me}
      BLUE_INTERNAL_TOKEN: ${BLUE_INTERNAL_TOKEN:-dev-blue-internal-change-me}
      BAYORA_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      RED_WORKER_URL: http://red-worker:8001
      BLUE_WORKER_URL: http://blue-worker:8002
      BAYORA_LEDGER_KEY_PATH: /var/lib/bayora/ledger_ed25519.pem
    volumes:
      - ledgerkey:/var/lib/bayora
    ports:
      - "8000:8000"
    depends_on: [db, red-worker, blue-worker]
    networks: [edge, data, tenants]
    mem_limit: 512m
    cpus: 1.0

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on: [backend]
    networks: [edge]

networks:
  edge:
    driver: bridge
  tenants:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
  # Not internal: Ollama needs egress to pull models. Isolation is membership —
  # only model-gateway is attached with it, so UI/workers/db cannot resolve it.
  llm:
    driver: bridge

volumes:
  pgdata:
  ledgerkey: